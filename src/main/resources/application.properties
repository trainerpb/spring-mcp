spring.application.name=simple-mcp-server

spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.protocol=STREAMABLE

spring.ai.mcp.server.name=ticketing-tool-streamable-v5-with-progress
spring.ai.mcp.server.version=1.0.0

spring.ai.mcp.server.capabilities.sampling=true
spring.ai.mcp.server.capabilities.roots=true
spring.ai.mcp.server.capabilities.elicitation=true


